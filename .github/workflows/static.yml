# Pages deployment is handled by pages.yml, which generates api-config.js.
# Keep this workflow manual-only so it cannot overwrite the configured deployment.
name: Manual static Pages deployment

on:
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare static site
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          set -eu
          test -n "$VITE_API_URL"
          if [ "$VITE_API_URL" != "https://collabx-uqwc.onrender.com" ]; then
            echo "VITE_API_URL must be https://collabx-uqwc.onrender.com for production" >&2
            exit 1
          fi
          mkdir -p site
          cp -R frontend/. site/
          node <<'NODE'
          const fs = require("fs");
          const url = process.env.VITE_API_URL.replace(/\/$/, "");
          fs.writeFileSync(
            "site/api-config.js",
            `window.__COLLABX_API_BASE__ = ${JSON.stringify(url)};\nwindow.COLLABX_API_BASE = ${JSON.stringify(url)};\n`
          );
          NODE
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
