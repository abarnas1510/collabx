<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Civic Profile - CollabX</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Serif:wght@700&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}body{margin:0;background:#F4F6F9;color:#1a1a1a;font:14px/1.55 'Noto Sans',sans-serif}.tricolor{height:5px;background:linear-gradient(to right,#FF9933 33.33%,#fff 33.33% 66.66%,#138808 66.66%)}a{color:#0B3C5D;text-decoration:none}.top{background:#0B3C5D;color:#fff;border-bottom:3px solid #FF9933}.top-inner,main{max-width:1100px;margin:auto}.top-inner{padding:13px 22px;display:flex;align-items:center;justify-content:space-between;gap:14px}.brand{font:23px 'Noto Serif',serif}.brand span{color:#FF9933}.top-actions{display:flex;gap:8px}.top-actions a,.top-actions button{border:1px solid #ffffff80;border-radius:3px;background:transparent;color:#fff;padding:7px 11px;font:600 12px inherit;cursor:pointer}.top-actions a:hover{background:#ffffff1f;text-decoration:none}main{padding:28px 22px 55px}.eyebrow{color:#B36A1B;font-size:11px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase}h1{margin:4px 0 18px;color:#0B3C5D;font:29px 'Noto Serif',serif}.profile-layout{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(260px,.65fr);gap:16px}.card{background:#fff;border:1px solid #D5DDE5;border-radius:4px;padding:20px;box-shadow:0 1px 3px #00000012}.civic-card{border-top:5px solid #0B3C5D}.identity{display:flex;align-items:center;gap:14px}.avatar{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:#E6F0F7;color:#0B3C5D;font-size:25px;font-weight:700;flex-shrink:0}.identity h2{margin:0;color:#0B3C5D;font-size:21px}.identity p{margin:2px 0;color:#687786}.role-badge,.verification{display:inline-block;margin-top:7px;padding:3px 8px;border-radius:12px;font-size:10px;font-weight:700}.role-badge{background:#E6F0F7;color:#0B3C5D}.verification{background:#E6F5E4;color:#138808;margin-left:4px}.civic-meta{display:grid;grid-template-columns:1fr 1fr;gap:0 18px;margin-top:18px}.field{padding:9px 0;border-bottom:1px dashed #E5E9EF}.field label{display:block;color:#7A8B99;font-size:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase}.field span{display:block;margin-top:2px;overflow-wrap:anywhere}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}.stat{background:#F8FAFC;border:1px solid #E5E9EF;padding:11px;text-align:center}.stat strong{display:block;color:#0B3C5D;font:20px 'Noto Serif',serif}.stat span{display:block;color:#687786;font-size:10px}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:17px}.btn{border:1px solid #0B3C5D;border-radius:3px;padding:9px 12px;background:#fff;color:#0B3C5D;font:600 12px inherit;cursor:pointer}.btn.primary{background:#0B3C5D;color:#fff}.btn.orange{border-color:#FF9933;background:#FF9933;color:#0B3C5D}.role-section h2,.side-card h2{margin:0 0 12px;color:#0B3C5D;font:18px 'Noto Serif',serif}.activity-list{display:grid;gap:8px}.activity{border:1px solid #E5E9EF;border-left:3px solid #0B3C5D;padding:10px;font-size:12px}.activity small{display:block;color:#7A8B99;margin-top:3px}.qr{text-align:center}.qr img{width:145px;height:145px;border:1px solid #D5DDE5;padding:7px}.qr p{color:#687786;font-size:11px;margin:8px 0 0}.edit-modal{display:none;position:fixed;inset:0;background:#0B3C5D55;z-index:10;place-items:center;padding:18px}.edit-modal.show{display:grid}.dialog{width:min(480px,100%);background:#fff;border-radius:4px;padding:22px;box-shadow:0 8px 28px #0003}.dialog h2{margin:0 0 15px;color:#0B3C5D;font:19px 'Noto Serif',serif}.form-group{margin-bottom:12px}.form-group label{display:block;color:#475569;font-size:12px;font-weight:600;margin-bottom:4px}.form-input{width:100%;border:1px solid #C5CEDA;border-radius:3px;padding:9px;font:inherit}.form-input:focus{outline:none;border-color:#0B3C5D;box-shadow:0 0 0 2px #0B3C5D1f}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.error{max-width:520px;margin:60px auto;background:#fff;border-left:4px solid #C0392B;padding:22px}@media(max-width:760px){.top-inner{padding:12px 16px}.top-actions a{display:none}main{padding:24px 16px 42px}.profile-layout{grid-template-columns:1fr}.civic-meta{grid-template-columns:1fr}.stats{grid-template-columns:repeat(3,1fr)}}@media print{.top-actions,.actions,.edit-modal,.qr,.side-card{display:none!important}body{background:#fff}.card{box-shadow:none}.profile-layout{display:block}.civic-card{max-width:700px}}
</style></head><body><div class="tricolor"></div><header class="top"><div class="top-inner"><div class="brand">COLLA<span>B</span>X</div><div class="top-actions"><a id="dashboard-link" href="index.html">Dashboard</a><button id="logout-btn" type="button">Logout</button></div></div></header><main id="profile-main"><div class="eyebrow">Account</div><h1>Civic Profile</h1><div class="profile-layout"><section class="card civic-card"><div class="identity"><div class="avatar" id="avatar">U</div><div><h2 id="profile-name">-</h2><p id="profile-email">-</p><span class="role-badge" id="profile-role">Platform user</span><span class="verification">âœ“ Verified account</span></div></div><div class="civic-meta"><div class="field"><label>Civic ID</label><span id="civic-id">-</span></div><div class="field"><label>Joined</label><span id="joined">-</span></div><div class="field"><label>Phone</label><span id="phone">Not provided</span></div><div class="field"><label>Organization</label><span id="organization">Not provided</span></div><div class="field"><label>Location</label><span id="district">Not provided</span></div><div class="field"><label>Role</label><span id="role-value">-</span></div></div><div class="stats" id="stats"></div><div class="actions"><button class="btn primary" onclick="openEdit()">Edit Profile</button><button class="btn orange" onclick="window.print()">Print Civic ID</button><button class="btn" id="qr-button" onclick="document.getElementById('qr-card').scrollIntoView({behavior:'smooth'})">View QR</button></div></section><aside class="stack"><section class="card qr side-card" id="qr-card"><h2>Civic ID QR</h2><img id="qr" alt="Civic ID QR code"><p id="qr-text">Scan to verify this Civic ID.</p></section><section class="card side-card"><h2>Quick Access</h2><div class="actions" style="margin-top:0"><a class="btn" id="primary-link" href="#">Open Dashboard</a><a class="btn" id="secondary-link" href="#">View Activity</a></div></section></aside><section class="card role-section"><h2 id="role-heading">Activity</h2><div class="activity-list" id="activity-list"></div></section></div></main><div class="edit-modal" id="edit-modal"><div class="dialog"><h2>Edit Profile</h2><form onsubmit="saveProfile(event)"><div class="form-group"><label>Name</label><input class="form-input" id="edit-name" required></div><div class="form-group"><label>Phone</label><input class="form-input" id="edit-phone"></div><div class="form-group"><label>Organization</label><input class="form-input" id="edit-organization"></div><div class="form-group"><label>District</label><input class="form-input" id="edit-district"></div><div class="form-group"><label>Email</label><input class="form-input" id="edit-email" disabled></div><div class="dialog-actions"><button class="btn" type="button" onclick="closeEdit()">Cancel</button><button class="btn primary" type="submit">Save Changes</button></div></form></div></div><script>
const API=window.__COLLABX_API_BASE__||window.COLLABX_API_BASE||'https://collabx-uqwc.onrender.com',token=localStorage.getItem('token'),stored=JSON.parse(localStorage.getItem('user')||'null'),routes={citizen:'citizen.html',university:'university.html',industry:'industry.html',expert:'expert.html',govt:'admin.html'};let user=stored,role=user?.role||'citizen';const labels={citizen:'Citizen',university:'University',industry:'Industry',expert:'Domain Expert',govt:'Government'};function esc(v){const d=document.createElement('div');d.textContent=v||'';return d.innerHTML}function text(v){return v||'Not provided'}function closeEdit(){document.getElementById('edit-modal').classList.remove('show')}function openEdit(){['name','phone','organization','district'].forEach(k=>document.getElementById('edit-'+k).value=user[k]||'');document.getElementById('edit-email').value=user.email||'';document.getElementById('edit-modal').classList.add('show')}
async function saveProfile(e){e.preventDefault();const payload={name:document.getElementById('edit-name').value.trim(),phone:document.getElementById('edit-phone').value.trim(),organization:document.getElementById('edit-organization').value.trim(),district:document.getElementById('edit-district').value.trim()};const r=await fetch(`${API}/users/me`,{method:'PATCH',headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json'},body:JSON.stringify(payload)});if(!r.ok){alert('Profile update failed.');return}user=await r.json();localStorage.setItem('user',JSON.stringify(user));closeEdit();render()}
async function loadStats(){const result={citizen:[],university:[],industry:[],expert:[],govt:[]};try{if(role==='citizen'){const r=await fetch(`${API}/challenges/mine`,{headers:{Authorization:`Bearer ${token}`}});const a=r.ok?await r.json():[];result.citizen=[['Reports submitted',a.length],['Resolved problems',a.filter(x=>x.status==='DEPLOYED').length],['Civic score',a.filter(x=>x.is_genuine).length*10]]}if(role==='university'){const [s,w]=await Promise.all([fetch(`${API}/solutions/mine`,{headers:{Authorization:`Bearer ${token}`}}),fetch(`${API}/workspaces/mine`,{headers:{Authorization:`Bearer ${token}`}})]);const sols=s.ok?await s.json():[],ws=w.ok?await w.json():[];result.university=[['Solutions submitted',sols.length],['Selected by experts',sols.filter(x=>x.expert_best_selected).length],['Industry collaborations',ws.length]]}if(role==='industry'){const w=await fetch(`${API}/workspaces/mine`,{headers:{Authorization:`Bearer ${token}`}});const ws=w.ok?await w.json():[];result.industry=[['Supported projects',ws.length],['Prototypes supported',ws.filter(x=>x.stage==='Development').length],['Deployments completed',ws.filter(x=>x.progress>=100).length]]}if(role==='govt'){const [c,s]=await Promise.all([fetch(`${API}/challenges/`),fetch(`${API}/matching/stats`)]);const cs=c.ok?await c.json():[],st=s.ok?await s.json():{};result.govt=[['Problems reviewed',cs.filter(x=>x.status!=='SUBMITTED').length],['Solutions under review',st.total_solutions||0],['Resolved problems',cs.filter(x=>x.status==='DEPLOYED').length]]}if(role==='expert'){const c=await fetch(`${API}/challenges/`);const cs=c.ok?await c.json():[];let total=0,selected=0;for(const ch of cs){const s=await fetch(`${API}/solutions/challenge/${ch.id}`);const a=s.ok?await s.json():[];total+=a.filter(x=>x.expert_score!=null).length;selected+=a.filter(x=>x.expert_best_selected).length}result.expert=[['Challenges reviewed',cs.length],['Solutions evaluated',total],['Selections made',selected]]}}catch(error){}return result[role]||[]}
async function render(){role=user?.role||'citizen';document.getElementById('profile-name').textContent=text(user.name);document.getElementById('profile-email').textContent=text(user.email);document.getElementById('profile-role').textContent=labels[role]||'Platform user';document.getElementById('role-value').textContent=labels[role]||role;document.getElementById('civic-id').textContent=`CIVIC-${String(user.id).padStart(6,'0')}`;document.getElementById('joined').textContent=user.created_at?new Date(user.created_at).toLocaleDateString('en-IN'):text(user.created_at);document.getElementById('avatar').textContent=(user.name||'U').trim().charAt(0).toUpperCase();document.getElementById('phone').textContent=text(user.phone);document.getElementById('organization').textContent=text(user.organization);document.getElementById('district').textContent=text(user.district);document.getElementById('dashboard-link').href=routes[role]||'index.html';document.getElementById('primary-link').href=routes[role]||'index.html';document.getElementById('secondary-link').href=role==='citizen'?'citizen.html':role==='university'?'university.html':role==='industry'?'industry.html':role==='expert'?'expert.html':'admin.html';const civicId=`CIVIC-${String(user.id).padStart(6,'0')}`;document.getElementById('qr').src=`https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${encodeURIComponent(JSON.stringify({civic_id:civicId,user_id:user.id,role}))}`;const stats=await loadStats();document.getElementById('stats').innerHTML=stats.map(x=>`<div class="stat"><strong>${x[1]}</strong><span>${x[0]}</span></div>`).join('');document.getElementById('role-heading').textContent=role==='citizen'?'Citizen Activity':role==='university'?'University Activity':role==='industry'?'Industry Activity':role==='expert'?'Expert Activity':'Government Activity';document.getElementById('activity-list').innerHTML=stats.map(x=>`<div class="activity"><strong>${x[0]}</strong><small>${x[1]} recorded on your Civic ID.</small></div>`).join('')||'<div class="activity">No activity recorded yet.</div>'}if(!user||!token){document.getElementById('profile-main').innerHTML='<div class="error"><h2>Sign in required</h2><p>Please sign in to view your Civic Profile.</p><a href="login.html">Go to Login</a></div>'}else{render()}document.getElementById('logout-btn').addEventListener('click',()=>{localStorage.removeItem('token');localStorage.removeItem('user');location.href='index.html'});
</script><script src="site-header.js"></script><script src="i18n.js"></script></body></html>
